<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My City Builder</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #202a35;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #17212b;
  padding: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

h1 { margin: 0; font-size: 22px; }

.stats {
  display: flex;
  gap: 16px;
  font-weight: bold;
  color: #8de6a0;
}

main {
  max-width: 1100px;
  margin: 20px auto;
  padding: 10px;
}

.toolbar, .camera-tools {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

button {
  border: 2px solid #526477;
  background: #344454;
  color: white;
  padding: 11px 14px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 14px;
}

button:hover { background: #50677c; }

button.active {
  background: #238c55;
  border-color: #66e39a;
}

.game-container {
  background: #17212b;
  padding: 10px;
  border-radius: 10px;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 5px;
  cursor: crosshair;
  touch-action: none;
}

.info {
  color: #bdc9d5;
  margin-top: 12px;
  font-size: 14px;
  line-height: 1.6;
}

.camera-label {
  color: #9fb2c5;
  font-size: 13px;
  margin-left: auto;
  align-self: center;
}

@media(max-width:600px) {
  .stats { font-size: 13px; gap: 9px; }
  button { padding: 9px; }
  h1 { font-size: 19px; }
}
</style>
</head>

<body>

<header>
  <h1>🏙️ My City Builder</h1>

  <div class="stats">
    <span>💰 $<span id="money">1000</span></span>
    <span>🏠 <span id="buildings">0</span></span>
    <span>🔍 <span id="zoomText">100%</span></span>
  </div>
</header>

<main>

  <div class="toolbar">
    <button class="active" data-tool="road">🛣️ Road ($10)</button>
    <button data-tool="house">🏠 House ($100)</button>
    <button data-tool="shop">🏪 Shop ($150)</button>
    <button data-tool="park">🌳 Park ($50)</button>
    <button data-tool="demolish">🗑️ Demolish</button>
    <button data-tool="pan">✋ Move Camera</button>
  </div>

  <div class="camera-tools">
    <button id="zoomOut">➖ Zoom Out</button>
    <button id="zoomIn">➕ Zoom In</button>
    <button id="resetView">🎯 Reset View</button>
    <span class="camera-label" id="position">Map: 50, 50</span>
  </div>

  <div class="game-container">
    <canvas id="game" width="960" height="640"></canvas>
  </div>

  <div class="info">
    <b>Building:</b> Select a building and click an empty tile.<br>
    <b>Zoom:</b> Use your mouse wheel or zoom buttons.<br>
    <b>Move:</b> Select Move Camera and drag the map.<br>
    <b>Keyboard:</b> Use arrow keys to move the camera and + / - to zoom.<br>
    <b>World:</b> 100 × 100 tiles.
  </div>

</main>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const TILE = 32;
const COLS = 100;
const ROWS = 100;

const WORLD_WIDTH = COLS * TILE;
const WORLD_HEIGHT = ROWS * TILE;

let money = 1000;
let selectedTool = "road";

let zoom = 1;
const MIN_ZOOM = 0.5;
const MAX_ZOOM = 2.5;

let cameraX = WORLD_WIDTH / 2 - canvas.width / 2;
let cameraY = WORLD_HEIGHT / 2 - canvas.height / 2;

let mouse = {x: 0, y: 0};

let dragging = false;
let dragMoved = false;
let dragStart = {x: 0, y: 0};
let lastPointer = {x: 0, y: 0};

let world = Array.from(
  {length: ROWS},
  () => Array(COLS).fill(null)
);

const prices = {
  road: 10,
  house: 100,
  shop: 150,
  park: 50
};

function clampCamera() {
  const viewWidth = canvas.width / zoom;
  const viewHeight = canvas.height / zoom;

  cameraX = Math.max(
    0,
    Math.min(WORLD_WIDTH - viewWidth, cameraX)
  );

  cameraY = Math.max(
    0,
    Math.min(WORLD_HEIGHT - viewHeight, cameraY)
  );
}

function getMousePosition(event) {
  const rect = canvas.getBoundingClientRect();

  return {
    x: (event.clientX - rect.left) * canvas.width / rect.width,
    y: (event.clientY - rect.top) * canvas.height / rect.height
  };
}

function screenToWorld(x, y) {
  return {
    x: cameraX + x / zoom,
    y: cameraY + y / zoom
  };
}

function randomDetail(x, y) {
  const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return n - Math.floor(n);
}

function drawGrass(x, y, col, row) {
  ctx.fillStyle = "#79ad59";
  ctx.fillRect(x, y, TILE, TILE);

  const detail = randomDetail(col, row);

  if (detail > 0.65) {
    ctx.fillStyle = "#8cbd68";
    ctx.fillRect(x + 5, y + 7, 3, 3);
    ctx.fillRect(x + 23, y + 22, 3, 3);
  }

  if (detail < 0.12) {
    ctx.fillStyle = "#6e9e4e";
    ctx.fillRect(x + 14, y + 5, 3, 3);
  }
}

function drawRoad(x, y) {
  ctx.fillStyle = "#686d73";
  ctx.fillRect(x, y, TILE, TILE);

  ctx.strokeStyle = "#d9d4a1";
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 5]);

  ctx.beginPath();
  ctx.moveTo(x + 16, y);
  ctx.lineTo(x + 16, y + TILE);
  ctx.stroke();

  ctx.setLineDash([]);
}

function drawHouse(x, y) {
  ctx.fillStyle = "#8e573b";
  ctx.fillRect(x + 4, y + 11, 24, 18);

  ctx.fillStyle = "#e5c49a";
  ctx.fillRect(x + 6, y + 13, 20, 16);

  ctx.fillStyle = "#a84b3f";
  ctx.beginPath();
  ctx.moveTo(x + 2, y + 14);
  ctx.lineTo(x + 16, y + 2);
  ctx.lineTo(x + 30, y + 14);
  ctx.fill();

  ctx.fillStyle = "#6b4735";
  ctx.fillRect(x + 13, y + 20, 7, 9);

  ctx.fillStyle = "#7ed6ed";
  ctx.fillRect(x + 7, y + 17, 5, 5);
  ctx.fillRect(x + 21, y + 17, 5, 5);
}

function drawShop(x, y) {
  ctx.fillStyle = "#f1d2a0";
  ctx.fillRect(x + 3, y + 10, 26, 19);

  ctx.fillStyle = "#e5a34f";
  ctx.fillRect(x + 3, y + 5, 26, 8);

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(x + 6, y + 7, 5, 5);
  ctx.fillRect(x + 17, y + 7, 5, 5);

  ctx.fillStyle = "#5c4838";
  ctx.fillRect(x + 12, y + 20, 8, 9);
}

function drawPark(x, y) {
  ctx.fillStyle = "#b8d88c";
  ctx.fillRect(x + 3, y + 3, 26, 26);

  ctx.fillStyle = "#805332";
  ctx.fillRect(x + 14, y + 15, 5, 13);

  ctx.fillStyle = "#267b3e";
  ctx.beginPath();
  ctx.arc(x + 16, y + 12, 11, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#64bd65";
  ctx.beginPath();
  ctx.arc(x + 12, y + 10, 5, 0, Math.PI * 2);
  ctx.fill();
}

function drawTile(x, y, type) {
  if (type === "road") drawRoad(x, y);
  if (type === "house") drawHouse(x, y);
  if (type === "shop") drawShop(x, y);
  if (type === "park") drawPark(x, y);
}

function drawWorld() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();

  // Camera transformation
  ctx.scale(zoom, zoom);
  ctx.translate(-cameraX, -cameraY);

  // Only draw tiles visible on the screen
  const startCol = Math.max(0, Math.floor(cameraX / TILE));
  const startRow = Math.max(0, Math.floor(cameraY / TILE));

  const endCol = Math.min(
    COLS,
    Math.ceil((cameraX + canvas.width / zoom) / TILE)
  );

  const endRow = Math.min(
    ROWS,
    Math.ceil((cameraY + canvas.height / zoom) / TILE)
  );

  for (let row = startRow; row < endRow; row++) {
    for (let col = startCol; col < endCol; col++) {
      const x = col * TILE;
      const y = row * TILE;

      drawGrass(x, y, col, row);
      drawTile(x, y, world[row][col]);

      ctx.strokeStyle = "rgba(0,0,0,0.12)";
      ctx.lineWidth = 1 / zoom;
      ctx.strokeRect(x, y, TILE, TILE);
    }
  }

  ctx.restore();

  updateCameraInfo();
}

function updateStats() {
  document.getElementById("money").textContent = money;

  let count = 0;

  for (const row of world) {
    for (const tile of row) {
      if (tile && tile !== "road") count++;
    }
  }

  document.getElementById("buildings").textContent = count;
}

function updateCameraInfo() {
  document.getElementById("zoomText").textContent =
    Math.round(zoom * 100) + "%";

  const centerX = Math.floor(
    (cameraX + canvas.width / zoom / 2) / TILE
  );

  const centerY = Math.floor(
    (cameraY + canvas.height / zoom / 2) / TILE
  );

  document.getElementById("position").textContent =
    "Map: " + centerX + ", " + centerY;
}

function setZoom(newZoom, screenX = canvas.width / 2,
                 screenY = canvas.height / 2) {

  const before = screenToWorld(screenX, screenY);

  zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));

  cameraX = before.x - screenX / zoom;
  cameraY = before.y - screenY / zoom;

  clampCamera();
  drawWorld();
}

function resetCamera() {
  zoom = 1;
  cameraX = WORLD_WIDTH / 2 - canvas.width / 2;
  cameraY = WORLD_HEIGHT / 2 - canvas.height / 2;

  clampCamera();
  drawWorld();
}

// Building selection
document.querySelectorAll("[data-tool]").forEach(button => {
  button.addEventListener("click", () => {
    selectedTool = button.dataset.tool;

    document.querySelectorAll("[data-tool]").forEach(b => {
      b.classList.remove("active");
    });

    button.classList.add("active");

    canvas.style.cursor =
      selectedTool === "pan" ? "grab" : "crosshair";
  });
});

// Zoom controls
document.getElementById("zoomIn").addEventListener("click", () => {
  setZoom(zoom * 1.25);
});

document.getElementById("zoomOut").addEventListener("click", () => {
  setZoom(zoom / 1.25);
});

document.getElementById("resetView").addEventListener("click", resetCamera);

// Mouse wheel zoom
canvas.addEventListener("wheel", event => {
  event.preventDefault();

  const pos = getMousePosition(event);

  setZoom(
    zoom * (event.deltaY < 0 ? 1.15 : 1 / 1.15),
    pos.x,
    pos.y
  );
}, {passive: false});

// Pointer controls
canvas.addEventListener("contextmenu", event => {
  event.preventDefault();
});

canvas.addEventListener("pointerdown", event => {
  const pos = getMousePosition(event);

  const wantsPan =
    selectedTool === "pan" ||
    event.button === 1 ||
    event.button === 2;

  if (wantsPan) {
    dragging = true;
    dragMoved = false;
    dragStart = pos;
    lastPointer = pos;

    canvas.setPointerCapture(event.pointerId);
    canvas.style.cursor = "grabbing";
    event.preventDefault();
    return;
  }

  if (event.button !== 0) return;

  // Build on pointer release to avoid building while dragging
  dragging = false;
  dragStart = pos;
  lastPointer = pos;
  dragMoved = false;

  canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener("pointermove", event => {
  const pos = getMousePosition(event);
  mouse = pos;

  if (!canvas.hasPointerCapture(event.pointerId)) return;

  const wantsPan =
    selectedTool === "pan" ||
    event.buttons === 4 ||
    event.buttons === 2;

  if (dragging) {
    const dx = pos.x - lastPointer.x;
    const dy = pos.y - lastPointer.y;

    if (Math.abs(pos.x - dragStart.x) +
        Math.abs(pos.y - dragStart.y) > 3) {
      dragMoved = true;
    }

    cameraX -= dx / zoom;
    cameraY -= dy / zoom;

    lastPointer = pos;

    clampCamera();
    drawWorld();
    return;
  }

  if (selectedTool === "pan" && wantsPan) {
    dragging = true;
  }
});

function placeTile(pos) {
  const point = screenToWorld(pos.x, pos.y);

  const col = Math.floor(point.x / TILE);
  const row = Math.floor(point.y / TILE);

  if (col < 0 || col >= COLS ||
      row < 0 || row >= ROWS) return;

  const existing = world[row][col];

  if (selectedTool === "demolish") {
    if (existing) {
      money += Math.floor((prices[existing] || 0) / 2);
      world[row][col] = null;
    }
  } else if (selectedTool !== "pan") {
    if (existing) return;

    const price = prices[selectedTool];

    if (money < price) {
      alert("Not enough money!");
      return;
    }

    money -= price;
    world[row][col] = selectedTool;
  }

  drawWorld();
  updateStats();
}

canvas.addEventListener("pointerup", event => {
  if (dragging) {
    dragging = false;
    canvas.style.cursor =
      selectedTool === "pan" ? "grab" : "crosshair";
    return;
  }

  if (!dragMoved && event.button === 0) {
    const pos = getMousePosition(event);
    placeTile(pos);
  }
});

canvas.addEventListener("pointercancel", () => {
  dragging = false;
  dragMoved = false;
  canvas.style.cursor =
    selectedTool === "pan" ? "grab" : "crosshair";
});

// Keyboard controls
window.addEventListener("keydown", event => {
  if (event.target.tagName === "INPUT") return;

  const amount = 60 / zoom;
  let changed = false;

  if (event.key === "ArrowUp") {
    cameraY -= amount;
    changed = true;
  }

  if (event.key === "ArrowDown") {
    cameraY += amount;
    changed = true;
  }

  if (event.key === "ArrowLeft") {
    cameraX -= amount;
    changed = true;
  }

  if (event.key === "ArrowRight") {
    cameraX += amount;
    changed = true;
  }

  if (event.key === "+" || event.key === "=") {
    setZoom(zoom * 1.2);
  }

  if (event.key === "-") {
    setZoom(zoom / 1.2);
  }

  if (changed) {
    event.preventDefault();
    clampCamera();
    drawWorld();
  }
});

// Start game
clampCamera();
drawWorld();
updateStats();

</script>
</body>
</html>
